name: Android checks
on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: android-actions/setup-android@v3
        with:
          # The default includes the retired SDK tools package.
          packages: platform-tools
      - name: Install Android components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Check core behavior
        run: sh scripts/check_core.sh
      - name: Prepare pinned dependencies
        run: python3 scripts/bootstrap.py
      - name: Build and lint all variants
        run: sh gradlew :app:testPocoDebugUnitTest :app:testPocoReleaseUnitTest :app:assembleSetupDebug :app:assembleOfflineDebug :app:lintSetupDebug :app:lintOfflineDebug :app:assemblePocoRelease :app:lintPocoRelease
      - name: Check offline APK permissions
        run: python3 scripts/check_apk_permissions.py --aapt "$ANDROID_HOME/build-tools/35.0.0/aapt" app/build/outputs/apk/offline/debug/app-offline-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: whipple-chat-android-builds
          path: app/build/outputs/apk/**/*.apk
      - name: Upload Android UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: whipple-chat-android-checks
          path: |
            app/build/reports/caption-screenshots/
            app/build/test-results/
            app/build/reports/tests/
            app/build/reports/lint-results-*
          retention-days: 14
