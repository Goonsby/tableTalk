name: Publish initial test downloads
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download and verify multilingual Whisper tiny
        run: python3 scripts/download_model.py tiny
      - name: Upload verified test downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum downloads/tabletalk-setup.apk downloads/tabletalk-offline.apk models/ggml-tiny.bin > downloads/SHA256SUMS.txt
          gh release upload v0.1.0-test downloads/tabletalk-setup.apk downloads/tabletalk-offline.apk models/ggml-tiny.bin downloads/SHA256SUMS.txt downloads/build-info.json downloads/WHISPER-LICENSE.txt --clobber
